
<app-title
    title="Lista de Tarefas"
    subtitle="Exemplo de uma lista de tarefas"
    description="Bem-vindo à lista de tarefas!">
</app-title>

<div>
  <input type="text" placeholder="Adicionar nova tarefa" class="input w-full"
    (keyup.enter)="addTodo($event)"
  />
</div>
<div class="flex flex-col gap-2 mt-4">
  @for(item of todos.items(); track item.id) {
    <div class="p-4 border border-zinc-800 rounded-lg flex items-center gap-4">
      <span class="flex-1"  [class.line-through]="item.done">{{item.title}}</span>
      <span

          [class.bg-green-700]="item.done"
          [class.bg-yellow-600]="!item.done"
          class="px-4 py-1 rounded-full text-sm font-medium"> {{item.done ? "Concluído" : "Pendente"}}
      </span>
      <div>
        <button (click)="todos.toggle(item.id)"
          [class.bg-zinc-700]="!item.done"
          [class.bg-green-700]="item.done"
        class="btn mr-2">
          <mat-icon fontSet="material-symbols-outlined">
            {{item.done ? "undo" : "check_circle"}}
          </mat-icon>
        </button>
        <button
          (click)="todos.remove(item.id)"
           class="btn bg-red-700">
          <mat-icon fontSet="material-symbols-outlined">
            delete
          </mat-icon>
        </button>
      </div>
    </div>
  }
</div>
